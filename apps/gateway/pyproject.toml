[project]
name = "llm-cost-gateway"
version = "0.1.0"
description = "OpenAI-compatible cost autopilot gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7",
  "cryptography>=42.0",
  "llm-cost-engine",
  "llm-cost-shared",
]

[project.scripts]
llm-cost-seed = "gateway.cli.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]