[project]
name = "llm-cost-shared"
version = "0.1.0"
description = "Shared models and helpers for LLM Cost Autopilot"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_shared"]