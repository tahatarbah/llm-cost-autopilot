[project]
name = "llm-cost-engine"
version = "0.1.0"
description = "Pricing, estimation, and aggregation for LLM Cost Autopilot"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/cost_engine/prices.json" = "cost_engine/prices.json"