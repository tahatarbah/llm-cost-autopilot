[project]
name = "llm-cost-sdk"
version = "0.1.0"
description = "Python SDK for LLM Cost Autopilot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "llm-cost-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cost_sdk"]